services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5099/api
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5099:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - ML_SERVICE_URL=http://ml-service:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_me}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=resume_user
      - DB_PASSWORD=resume_pass
      - DB_NAME=resume_screening
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - ml-service
      - mysql

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=resume_screening
      - MYSQL_USER=resume_user
      - MYSQL_PASSWORD=resume_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  mysql-data:
